---
name: Release

'on':
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked --bins

      - name: Smoke test binaries
        run: |
          ./target/release/lode --help
          ./target/release/loded --help

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/lode-linux-x86_64.tar.gz" -C target/release lode loded

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes dist/lode-linux-x86_64.tar.gz
