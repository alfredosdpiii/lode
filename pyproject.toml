[project]
name = "lode-kg"
version = "0.1.2"
description = "Lode: fully local repository knowledge graph daemon and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bryan" }]
keywords = [
  "code-intelligence",
  "knowledge-graph",
  "kuzu",
  "sqlite",
  "cli",
  "agents",
  "lode",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alfredosdpiii/lode"
Repository = "https://github.com/alfredosdpiii/lode"
Issues = "https://github.com/alfredosdpiii/lode/issues"

[project.optional-dependencies]
kuzu = ["kuzu>=0.11.0"]
dev = []

[project.scripts]
lode = "lode.cli:main"
loded = "lode.daemon:main"
kg = "lode.cli:main"
kgd = "lode.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/lode"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/lode", "tests", "scripts", "benchmarks"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
branch = true
source = ["src/lode"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B310", "B324", "B404", "B603", "B607", "B608"]

[tool.deptry]
extend_exclude = ["tests", ".venv", "dist", "build"]
known_first_party = ["lode"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.14.1",
    "deptry>=0.25.1",
    "mypy>=2.1.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.0",
    "radon>=6.0.1",
    "ruff>=0.15.17",
    "vulture>=2.16",
]
