[project]
name = "lode-kg"
version = "0.1.0"
description = "Lode: fully local repository knowledge graph daemon and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Bryan" }
]
keywords = ["code-intelligence", "knowledge-graph", "kuzu", "sqlite", "cli", "agents", "lode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
kuzu = ["kuzu>=0.11.0"]
dev = []

[project.scripts]
lode = "lode.cli:main"
loded = "lode.daemon:main"
kg = "lode.cli:main"
kgd = "lode.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/lode"]

