[workspace]
members = ["."]
resolver = "3"

[package]
name = "lode"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Fully local repository knowledge graph for agents (Rust port)."
license = "MIT"
publish = false

[lib]
name = "lode"
path = "src/lib.rs"

[[bin]]
name = "lode"
path = "src/bin/lode.rs"

[[bin]]
name = "loded"
path = "src/bin/loded.rs"

[features]
default = []
# Kuzu projection is not ported; enabling it keeps the "Kuzu is not installed" error. See PORTING.md.
kuzu = []
# Local code-embedding reranker (`lode context --rerank`, `lode rerank-model`), run on the CPU
# with candle. The `lode embed` client for a local embeddings service is always built.
embed = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:hf-hub"]

[dependencies]
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
hf-hub = { version = "0.4.3", optional = true, default-features = false, features = ["ureq"] }
tokenizers = { version = "0.23.2", optional = true, default-features = false, features = ["fancy-regex"] }
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
indexmap = "2"
rayon = "1"
regex = "1"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "embed_probe"
required-features = ["embed"]

[profile.release]
debug = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
